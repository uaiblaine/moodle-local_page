head_system_only | lib.php | head_system_only.pl
#   -> test_head_html_is_withheld_from_a_category_page (tests/trust_test.php)

# Return the record unchanged from the publishing gate, so the posted value decides and every
# category author publishes to the open web. The form's freeze is untouched by this mutation,
