# --- Lifecycle (stage 8) --------------------------------------------------------------------
# What a category's deletion does to its pages: lib.php's two pre_course_category_* callbacks, which
# delegate to \local_page\local\lifecycle. The lib_test cases delete and move categories through
# core_course_category itself, so core's context deletion — and every file it purges — runs after the
# callback exactly as on a site; lifecycle_test calls the class directly and holds what it leaves alone.
# There is no order gate inside category_moved(): the whole callback runs before core touches anything,
# so what a test can hold is the outcome — the files are in the new context after core deleted the old
# one — and move_relocates_files / move_both_areas are the gates on it.
#
# Every list below is the measured one: these ten swept on m502b on 2026-09-23 (--only), baseline 176,
# 10 of 10 red; the whole spec (66 patterns) dry-runs clean.

# The category's pages are not marked deleted.
delete_soft_deletes     | classes/local/lifecycle.php | delete_soft_deletes.pl
#   -> test_category_deleted_soft_deletes_the_categorys_own_pages_only (tests/local/lifecycle_test.php)
#   -> test_deleting_a_category_soft_deletes_its_pages_and_its_childrens_only (tests/lib_test.php)

# Marked deleted, but the slug is kept rather than released as <slug>-deleted-<id>.
delete_releases_slugs   | classes/local/lifecycle.php | delete_releases_slugs.pl
#   -> test_category_deleted_soft_deletes_the_categorys_own_pages_only (tests/local/lifecycle_test.php)
#   -> test_deleting_a_category_soft_deletes_its_pages_and_its_childrens_only (tests/lib_test.php)

# The pages' public short codes are left in core's table.
delete_forgets_codes    | classes/local/lifecycle.php | delete_forgets_codes.pl
#   -> test_category_deleted_soft_deletes_the_categorys_own_pages_only (tests/local/lifecycle_test.php)
#   -> test_deleting_a_category_soft_deletes_its_pages_and_its_childrens_only (tests/lib_test.php)

