# enabled the trusttext feature — which is every site by default.
trust_requires_setting | lib.php | trust_requires_setting.pl
#   -> test_content_trust_needs_the_setting_and_the_capability_in_this_context (tests/trust_test.php)

# Trust every category page at render time, whatever its stored flag says.
render_category_trusted | lib.php | render_category_trusted.pl
#   -> test_render_content_cleans_a_category_page_unless_its_author_was_trusted (tests/trust_test.php)

# Skip the pre-edit cleaning, so an untrusted editor is handed a trusted author's script and
# re-saves it under their own flag. Nothing a viewer sees changes, which is what makes this the
# half worth holding separately from the rendering gate above.
preedit_clean | lib.php | preedit_clean.pl
#   -> test_editable_content_cleans_for_an_editor_who_is_not_trusted (tests/trust_test.php)

# Emit a category page's stored <head> HTML. No sanitiser exists for head markup, which is the
