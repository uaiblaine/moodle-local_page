# Mutation spec for local_page — run with
#   mdl mutate moodle-local_page /Users/uaiblaine/dev/moodle-local_page/mutations/gates.conf --stack m502b
#
# Each line breaks ONE guard and names the test that must go red because of it. That pairing is the
# claim this file exists to keep executable: a guard whose mutation reddens NOTHING is held by no
# test, whatever its comment says — and that is the finding, not the pass.
#
# Run `--dry-run` first. It applies every pattern, prints the diff and restores without testing,
# which is how you see that a pattern still matches the line it was written for after the file has
# moved. A pattern that matches nothing is a hard error, not a pass. perl interpolates $variables
# on BOTH sides of s///, so every literal dollar in these scripts is written \$.
#
#     tag | file relative to the repo | perl script relative to this file

# --- The Open Graph image gate (lib.php) ----------------------------------------------------
# Delete the servability call from the ogimage branch of local_page_pluginfile(): the file area
# goes back to being world-readable by itemid, so the image of a draft, archived, expired or
# deleted page is served to anyone who guesses the page id.
#
# The test passes ['dontdie' => true], and that option is what makes this gate safe to sweep. With
# the guard gone the call falls through to send_stored_file(), which ends in `die` unless dontdie
# is set — and a die inside PHPUnit kills the run before any verdict line is printed, which
# mdl-mutate reads as "the suite never ran" rather than as a red. With dontdie the call returns,
# the assertFalse() fails, and the mutation reddens the way it is supposed to. (The run is also
# marked risky, because readfile_accel() closes every output buffer including PHPUnit's; that is
# expected noise in the mutated run only.)
ogimage_gate          | lib.php | ogimage_gate.pl
#   -> test_the_ogimage_pluginfile_branch_refuses_unpublished_pages (tests/lib_test.php)

# Make the predicate itself answer true for any row that is not deleted. This is the misreading
# the docblock invites — "it ignores the viewer" taken as "it ignores everything" — so it is worth
# holding separately from the call site above.
ogimage_ignores_status | lib.php | ogimage_ignores_status.pl
#   -> test_ogimage_servability_by_publication_state (tests/lib_test.php)
#   -> test_the_ogimage_pluginfile_branch_refuses_unpublished_pages

# --- The write-path re-check (lib.php) ------------------------------------------------------
# Drop the deleted filter from the row lookup, so a soft-deleted page can be reopened in the
# editor and saved back into existence — with its old friendly URL, which by then may belong to
# another page.
editable_recheck      | lib.php | editable_recheck.pl
#   -> test_require_editable_page_refuses_a_missing_or_deleted_row (tests/lib_test.php)

# --- Access level validation (forms/edit.php) -----------------------------------------------
# Drop the refusal of an access level made only of negations. Such a rule grants the page to every
# visitor, anonymous ones included, while reading like a restriction.
negation_only         | forms/edit.php | negation_only.pl
#   -> test_an_access_level_of_negations_only_is_refused (tests/forms/edit_form_test.php)

# --- Friendly URL uniqueness (classes/local/slug.php) ---------------------------------------
# Make is_taken() answer false for everything. The form's refusal and the re-check inside the save
# lock both read through it, so a page could take an address another live page is serving.
slug_taken            | classes/local/slug.php | slug_taken.pl
#   -> test_a_slug_another_live_page_holds_is_refused (tests/forms/edit_form_test.php)
#   -> test_is_taken_counts_only_pages_that_are_not_deleted (tests/local/slug_test.php)

# Make deleted_name() hand the slug back unchanged, so a deleted page keeps holding its address
# for ever and no successor can ever use it.
#
# tests/forms/edit_form_test.php's test_a_slug_held_only_by_a_deleted_page_is_accepted is NOT part
# of this gate, and the reason is worth keeping: it only asks the form whether a freed slug is
# accepted, and both the form and is_taken() filter on `deleted = 0` alone — they never read back
# the stored value of a deleted row, so that test passes whether or not deleted_name() mangles
# anything. It reddens under the slug_taken gate above instead. What the mangling protects is a
# restore, which is what the last test named here exercises.
slug_released         | classes/local/slug.php | slug_released.pl
#   -> test_a_deleted_page_releases_its_slug (tests/local/slug_test.php)
#   -> test_deleted_name (tests/local/slug_test.php)
#   -> test_normalise_all_brings_every_row_into_line (tests/local/slug_test.php)
#   -> test_a_restored_page_cannot_take_back_the_address_its_successor_holds (tests/local/slug_test.php)

# --- The context dimension (stage 2) ---------------------------------------------------------
# Answer scope::capability() with local/page:addpages at every context level, collapsing the split
# between authoring the site's pages and authoring one category's. Every call site keeps reading as
# though the split were there.
#
# This is the widest gate in the file, and it widens again with every new caller of
# scope::capability(): the list below is the whole of what it reddens, measured on m502b on
# 2026-09-22 (8 red, Errors: 2, Failures: 6), not a sample. The last three arrived with stage 4,
# because local_page_extend_navigation_category_settings() asks scope::capability() which
# capability a category's menu node is gated on. Re-measure this list rather than reasoning about
# it whenever a call site is added — the mutation is answered by the mapping, not by the caller.
capability_mapping    | classes/local/scope.php | capability_mapping.pl
#   -> test_each_context_level_maps_to_its_own_capability (tests/local/scope_test.php)
#   -> test_a_context_level_the_plugin_does_not_use_is_refused (tests/local/scope_test.php)
#   -> test_the_preview_branch_is_evaluated_at_the_pages_own_context (tests/lib_test.php)
#   -> test_require_editable_page_is_scoped_to_the_pages_own_context (tests/lib_test.php)
#   -> test_require_editable_page_checks_the_posted_context_for_a_new_page (tests/lib_test.php)
#   -> test_the_node_is_offered_to_a_manager_of_that_category (tests/navigation_test.php)
#   -> test_the_node_is_withheld_from_a_user_who_holds_nothing (tests/navigation_test.php)
#   -> test_the_node_is_withheld_at_a_category_the_manager_does_not_hold (tests/navigation_test.php)

# Take the context of a save from the POSTED hidden field even for a page that already exists, so a
# page can be moved between contexts — into one whose capability was never checked.
context_switch_ignored | lib.php | context_switch_ignored.pl
#   -> test_a_posted_context_never_moves_an_existing_page (tests/lib_test.php)

# Drop the contextid clause from the category pagecontent lookup: the row is then found by item id
# alone and any category context serves a file stored under that id.
#
# Like the ogimage gates, the tests pass ['dontdie' => true]: with the guard gone the call falls
# through to send_stored_file(), and a die inside PHPUnit kills the run before any verdict line is
# printed, which mdl-mutate reads as "the suite never ran" rather than as a red.
pluginfile_context_match | lib.php | pluginfile_context_match.pl
#   -> test_the_pagecontent_file_route_is_scoped_to_the_pages_own_context (tests/lib_test.php)

# Drop the context clause from the shared site-wide pagecontent search. Everything in that area is
# stored under item id 0, so the only thing that says who owns a file is the page content naming
# it — and without the clause a page of ANY context says it, including a category page written by
# whoever manages that category. Their own page being viewable would then serve a site-wide file
# whose own page is a draft.
pagecontent_scope     | lib.php | pagecontent_scope.pl
#   -> test_a_page_of_another_context_cannot_authorise_a_site_wide_file (tests/lib_test.php)

# Drop the comparison between the page's own context and the one the og:image was requested
# through. Page ids are unique table-wide, so the item id alone would decide who may serve it.
ogimage_context_match | lib.php | ogimage_context_match.pl
#   -> test_the_ogimage_file_route_refuses_a_row_from_another_context (tests/lib_test.php)

# Make local_page_page_in_context() answer true for every row, which is the guard the delete action
# on the listing screen applies. pages.php is a script, so the comparison lives in lib.php purely so
# that this gate can exist — a guard reachable only from a script is a guard no test holds.
delete_scope          | lib.php | delete_scope.pl
#   -> test_page_in_context_compares_the_stored_convention (tests/lib_test.php)

# Make is_reserved() answer false, so a page may take an address Moodle itself answers on.
slug_reserved         | classes/local/slug.php | slug_reserved.pl
#   -> test_a_reserved_slug_is_refused (tests/forms/edit_form_test.php)
#   -> test_is_reserved_covers_core_paths_router_segments_and_plugin_names (tests/local/slug_test.php)
#   -> test_normalise_all_does_not_rename_a_reserved_legacy_slug (tests/local/slug_test.php)

# Drop the contextid clause from is_taken(), returning uniqueness to the site-wide rule this stage
# replaced: one category claiming an address would stop every other category from using it.
slug_per_context      | classes/local/slug.php | slug_per_context.pl
#   -> test_a_slug_is_taken_only_within_its_own_context (tests/local/slug_test.php)
#   -> test_a_slug_held_in_another_category_is_accepted (tests/forms/edit_form_test.php)

